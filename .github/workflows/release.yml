# Publishing a release: push a version tag (git tag v1.2.0 && git push origin v1.2.0).
# This builds the firmware, attaches it to a GitHub release (devices update themselves from the latest
# release) and redeploys the web installer on GitHub Pages with the new version.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # create the release
  pages: write
  id-token: write  # deploy to Pages

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          PLATFORMIO_BUILD_FLAGS="-DFIRMWARE_VERSION=\\\"$version\\\"" pio run

      - name: Package
        run: tools/package_release.sh "$VERSION"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/cyd-spotify-ota.bin
            dist/cyd-spotify-full.bin
          generate_release_notes: true

      - name: Assemble installer site
        run: cp -R site/. dist/site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

; Now Playing Brickman: ESP32-2432S028R ("Cheap Yellow Display")
; espressif32 6.x = Arduino core 2.0.x, which TFT_eSPI 2.5.x is known to work with.

[env:cyd]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Two 1.875 MB app slots for over-the-air updates, 128 KB LittleFS, 64 KB crash log (see partitions.csv).
board_build.partitions = partitions.csv
; Root CAs for verifying HTTPS servers (tools/gen_crt_bundle.py).
board_build.embed_files = data/cert/x509_crt_bundle.bin

lib_deps =
    lvgl/lvgl @ 9.2.2
    bodmer/TFT_eSPI @ 2.5.43
    ; The registry copy is a 2019 alpha; v1.4 adds begin(SPIClass&), needed for the separate touch bus.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson @ 7.2.1
    bitbank2/JPEGDEC @ 1.8.4

build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
    ; TFT_eSPI is configured here instead of editing its User_Setup.h.
    ; The display is on HSPI; touch is on VSPI (see src/board.h).
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
